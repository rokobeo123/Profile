version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: personal-os-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-personal_os}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: personal-os-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@db:5432/${POSTGRES_DB:-personal_os}?schema=public
      - AUTH_SECRET=${AUTH_SECRET}
      - OWNER_PASSWORD=${OWNER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_prod:
